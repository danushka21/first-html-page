<!DOCTYPE html>
<html>
<head>
    <title>My First HTML Page</title>
</head>
<body>

    <!-- Heading -->
    <h1>Welcome to My First Web Page</h1>

    <!-- Paragraph -->
    <p>This is my first HTML page. I am learning full stack development!</p>

    <!-- Unordered List -->
    <h2>My Hobbies</h2>
    <ul>
        <li>Reading</li>
        <li>Coding</li>
        <li>Music</li>
    </ul>

    <!-- Ordered List -->
    <h2>My Daily Routine</h2>
    <ol>
        <li>Wake up</li>
        <li>Study</li>
        <li>Practice coding</li>
    </ol>

    <!-- Link -->
    <p>Visit Google:
        <a href="https://www.google.com" target="_blank">Click Here</a>
    </p>

    <!-- Image -->
    <h2>Sample Image</h2>
    <img src="https://via.placeholder.com/150" alt="Sample Image">

</body>
</html>
