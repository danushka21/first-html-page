<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Grid Photo Gallery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      padding: 40px;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .title p {
      color: #ccc;
      font-size: 16px;
    }

    .gallery {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 180px;
      gap: 15px;

      grid-template-areas:
        "hero hero city nature"
        "hero hero food nature"
        "beach mountains mountains portrait"
        "travel travel night portrait"
        "forest art art street";
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      cursor: pointer;
      background: #222;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease, filter 0.5s ease;
    }

    .gallery-item figcaption {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
      filter: brightness(60%);
    }

    .gallery-item:hover figcaption {
      opacity: 1;
      transform: translateY(0);
    }

    .hero { grid-area: hero; }
    .city { grid-area: city; }
    .nature { grid-area: nature; }
    .food { grid-area: food; }
    .beach { grid-area: beach; }
    .mountains { grid-area: mountains; }
    .portrait { grid-area: portrait; }
    .travel { grid-area: travel; }
    .night { grid-area: night; }
    .forest { grid-area: forest; }
    .art { grid-area: art; }
    .street { grid-area: street; }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }

      .gallery {
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 160px;
        grid-template-areas:
          "hero hero"
          "city nature"
          "food nature"
          "beach mountains"
          "travel travel"
          "night portrait"
          "forest portrait"
          "art art"
          "street street";
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
        grid-template-areas: none;
      }

      .gallery-item {
        grid-area: auto;
      }

      .title h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <section class="title">
    <h1>Photo Gallery</h1>
    <p>CSS Grid gallery using grid-template-areas and hover overlay effect</p>
  </section>

  <section class="gallery">
    <figure class="gallery-item hero">
      <img src="https://picsum.photos/id/1015/800/600" alt="Nature landscape">
      <figcaption>Nature</figcaption>
    </figure>

    <figure class="gallery-item city">
      <img src="https://picsum.photos/id/1011/600/600" alt="City view">
      <figcaption>City</figcaption>
    </figure>

    <figure class="gallery-item nature">
      <img src="https://picsum.photos/id/1020/600/900" alt="Green forest">
      <figcaption>Forest</figcaption>
    </figure>

    <figure class="gallery-item food">
      <img src="https://picsum.photos/id/1080/600/600" alt="Food plate">
      <figcaption>Food</figcaption>
    </figure>

    <figure class="gallery-item beach">
      <img src="https://picsum.photos/id/1016/600/600" alt="Beach">
      <figcaption>Beach</figcaption>
    </figure>

    <figure class="gallery-item mountains">
      <img src="https://picsum.photos/id/1002/900/600" alt="Mountains">
      <figcaption>Mountains</figcaption>
    </figure>

    <figure class="gallery-item portrait">
      <img src="https://picsum.photos/id/1005/600/900" alt="Portrait">
      <figcaption>Portrait</figcaption>
    </figure>

    <figure class="gallery-item travel">
      <img src="https://picsum.photos/id/1036/900/600" alt="Travel place">
      <figcaption>Travel</figcaption>
    </figure>

    <figure class="gallery-item night">
      <img src="https://picsum.photos/id/1033/600/600" alt="Night scene">
      <figcaption>Night</figcaption>
    </figure>

    <figure class="gallery-item forest">
      <img src="https://picsum.photos/id/1043/600/600" alt="Forest path">
      <figcaption>Path</figcaption>
    </figure>

    <figure class="gallery-item art">
      <img src="https://picsum.photos/id/1067/900/600" alt="Art image">
      <figcaption>Art</figcaption>
    </figure>

    <figure class="gallery-item street">
      <img src="https://picsum.photos/id/1076/600/600" alt="Street view">
      <figcaption>Street</figcaption>
    </figure>
  </section>
</body>
</html>
