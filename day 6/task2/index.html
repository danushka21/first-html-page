<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Navigation CSS Toggle</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .navbar {
      width: 100%;
      background: #0f172a;
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #menu-toggle {
      display: none;
    }

    .hamburger {
      width: 32px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 10;
    }

    .hamburger span {
      width: 100%;
      height: 4px;
      background: white;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .nav-links {
      list-style: none;
      position: absolute;
      top: 68px;
      left: 0;
      width: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-10px);
      transition: max-height 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
    }

    .nav-links li {
      width: 100%;
      text-align: center;
    }

    .nav-links a {
      display: block;
      padding: 16px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .nav-links a:hover {
      background: #1e293b;
      color: #38bdf8;
    }

    #menu-toggle:checked ~ .nav-links {
      max-height: 300px;
      opacity: 1;
      transform: translateY(0);
    }

    #menu-toggle:checked ~ .hamburger span:nth-child(1) {
      transform: rotate(45deg) translate(7px, 7px);
    }

    #menu-toggle:checked ~ .hamburger span:nth-child(2) {
      opacity: 0;
    }

    #menu-toggle:checked ~ .hamburger span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -7px);
    }

    .hero {
      min-height: calc(100vh - 68px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero h1 {
      font-size: 36px;
      color: #0f172a;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #475569;
      line-height: 1.6;
    }

    @media (min-width: 768px) {
      .navbar {
        padding: 20px 60px;
      }

      .hamburger {
        display: none;
      }

      .nav-links {
        display: flex !important;
        position: static;
        width: auto;
        background: transparent;
        flex-direction: row;
        align-items: center;
        gap: 28px;
        max-height: none;
        opacity: 1;
        transform: none;
        overflow: visible;
      }

      .nav-links li {
        width: auto;
      }

      .nav-links a {
        padding: 8px 0;
        font-size: 16px;
        position: relative;
      }

      .nav-links a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0;
        height: 2px;
        background: #38bdf8;
        transition: width 0.3s ease;
      }

      .nav-links a:hover {
        background: transparent;
        color: #38bdf8;
      }

      .nav-links a:hover::after {
        width: 100%;
      }

      .hero h1 {
        font-size: 48px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="logo">MyLogo</div>

    <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Responsive Navigation</h1>
      <p>
        This navbar uses only HTML and CSS. On mobile, the hamburger menu opens
        and closes using the CSS :checked selector. No JavaScript is used.
      </p>
    </div>
  </section>

</body>
</html>
